### Services [ services ]
services:
  title: "What I Do"
  subtitle: "my <b>Services</b>"
  bg_title: "Expertise"

  items:
    - title: "나의 기술 여정"
      subtitle: "My Tech Journey"
      text: "안녕하세요. 저는 사이버보안 전문가를 향한 여정을 걸어가고 있습니다. 이 블로그는 네트워크관리사, 리눅스마스터 자격증을 통해 시스템과 네트워크의 기초를 다지고, 정보보안산업기사, 정보처리기사 자격증을 통해 전문성을 심화하는 과정을 기록합니다. 단순한 자격증 취득을 넘어, 깊이 있는 지식과 실무 능력을 갖춘 전문가로 성장하는 것을 목표로 합니다."
      #button_label: "See Pricing"
      # button_link: "#pricing-section"

    - title: "역량 구축"
      subtitle: "Building My Expertise"
      text: "이곳은 사이버보안 전문가를 꿈꾸는 저의 역량 구축 공간입니다. 리눅스 시스템 관리, 네트워크 인프라 구축, 정보 보안 원리, 효율적인 데이터 처리 및 분석까지, 리눅스마스터, 네트워크관리사, 정보보안산업기사, 정보처리기사 자격증과 관련된 핵심 내용을 체계적으로 정리하고 실질적인 학습 경험을 공유합니다."
      #button_label: "See Pricing"
      #button_link: "#pricing-section"

    - title: "학습 &amp; 성장"
      subtitle: "Learning &amp; Growth"
      text: "저는 미래의 사이버보안 전문가를 꿈꾸며 끊임없이 배우고 성장하고 있습니다. 이 블로그는 리눅스, 네트워크, 정보보안 관련 지식을 쌓고, 관련 자격증(네트워크관리사, 리눅스마스터, 정보보안산업기사, 정보처리기사)을 취득하는 과정을 상세히 기록합니다. 이 여정을 통해 얻는 지식과 경험을 공유하며, 함께 성장하는 동료들을 만나고 싶습니다."
      #button_label: "See Pricing"
      #button_link: "#pricing-section"

    - title: "나의 탐구"
      subtitle: "My Endeavor"
      text: "이 블로그는 사이버보안 기술에 대한 저의 진지한 탐구 기록입니다. 네트워크관리사, 리눅스마스터를 통해 시스템과 네트워크의 기본을 확립하고, 정보보안산업기사, 정보처리기사를 통해 보안의 심층적인 영역을 탐구합니다. 이론적인 내용뿐만 아니라 실제 문제 해결 과정과 경험을 공유하며, 사이버보안 분야에 기여할 수 있는 전문가로 성장하고자 합니다."
      #button_label: "See Pricing"
      #button_link: "#pricing-section"

    - title: "전문성 개발"
      subtitle: "Professional Development"
      text: "저는 사이버보안 전문가로 나아가기 위한 로드맵을 체계적으로 설계하고, 그 과정을 이 블로그에 담고 있습니다. 리눅스마스터, 네트워크관리사 자격증으로 기초를 다지고, 정보보안산업기사, 정보처리기사 자격증을 통해 전문성을 높이는 과정을 통해, 궁극적으로 실무에 능통한 사이버보안 전문가로 발돋움하는 것을 목표로 합니다."
      #button_label: "See Pricing"
      #button_link: "#pricing-section"

### Skills [ skills ]
skills:
  title: "Professional Skills"
  subtitle: "my <b>Talent</b>"
  bg_title: "Skills"

  column1:
    items:
      - label: "Linux" #0-10 progress in dots
        text: "리눅스마스터 2급 자격증을 보유하고 있으며, CLI 환경에서 시스템 관리 및 문제 해결에 능숙합니다. 특히 Vim을 활용한 설정 파일 편집과 iptables를 이용한 방화벽 구축 경험을 통해 네트워크 보안 기초 역량을 갖추고 있습니다."
        value: "50" #0-100 progress in %

      - label: "Python" #0-10 progress in dots
        text: "파이썬 기본 문법과 내장 함수를 활용하여 데이터 처리 및 자동화 스크립트 작성이 가능하며, 다양한 라이브러리를 활용한 데이터 분석 및 웹 스크래핑 경험이 있습니다. 또한, 파이썬을 이용한 간단한 웹 애플리케이션 개발 경험도 보유하고 있습니다."
        value: "40" #0-100 progress in %

  column2:
    items:
      - label: "html" #0-10 progress in dots
        text: "웹 표준 및 웹 접근성을 준수하는 HTML5 마크업 작성에 능숙하며, 시맨틱 태그를 활용하여 웹 페이지 구조를 효율적으로 설계합니다. 온라인 강의 수료 및 다수의 웹페이지 제작 경험을 통해 견고하고 유지보수하기 쉬운 프론트엔드 기반을 구축할 수 있습니다."
        value: "75" #0-100 progress in %

      - label: "PowerPoint" #0-10 progress in dots
        text: "다양한 템플릿을 활용하여 학교 발표 및 보고서용 PPT를 다수 제작했습니다. 시각적 자료 구성 능력과 애니메이션 효과를 통해 정보를 명확하고 효과적으로 전달하며, 발표 내용의 핵심을 부각시키는 디자인 감각을 갖추고 있습니다."
        value: "70" #0-100 progress in %

  column3:
    items:
      - label: "C" #0-10 progress in dots
        text: "C언어의 기본 문법부터 자료구조, 알고리즘(재귀 함수 포함)까지 학습하며 프로그래밍 기초를 다졌습니다. 효율적인 코드 작성 능력과 메모리 관리의 중요성을 이해하고 있으며, 문제 해결 역량을 갖추고 있습니다."
        value: "50" #0-100 progress in %

      - label: "Excel" #0-10 progress in dots
        text: "엑셀의 기본 기능과 다양한 함수(SUM, AVERAGE, IF, VLOOKUP 등)를 활용하여 데이터를 효율적으로 정리하고 분석할 수 있습니다. 현재 함수를 이용한 데이터 정리 및 피벗 테이블 등 심화 기능을 학습하며 실무 활용 역량을 강화하고 있습니다."
        value: "50" #0-100 progress in %

